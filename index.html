/* v3.85: robust roster action dispatcher.
   Fixes a click-loss case when the roster search input still has focus: its
   blur/change can redraw the roster before the normal click event reaches the
   Buy / Remove / Add / Talisman button. Capture pointerdown first, perform the
   action immediately, and suppress the later synthetic click. */
(function(){
  const RECENT_MS=900;
  let lastAction=null;
  function actionKeyV384(el){
    if(!el)return '';
    if(el.matches?.('[data-owned]'))return 'owned:'+el.dataset.owned;
    if(el.matches?.('[data-add]'))return 'add:'+el.dataset.add;
    if(el.matches?.('[data-talisman]'))return 'talisman:'+el.dataset.talisman+':'+el.dataset.talismanVal;
    return '';
  }
  function findRosterActionV384(e){
    const start=(e.target&&e.target.nodeType===1)?e.target:e.target?.parentElement;
    const el=start?.closest?.('[data-owned],[data-add],[data-talisman]');
    if(!el)return null;
    if(el.closest?.('#modal'))return null;
    return el;
  }
  function runRosterActionV384(el){
    const own=el.matches?.('[data-owned]')?el:null;
    if(own){
      const val=own.dataset.ownedVal==='1';
      const parsedRoot=own.closest('#rosterTreeWrap .parsed-layout');
      if(parsedRoot){
        const id=own.dataset.owned;
        state.roster[id]=state.roster[id]||{};
        state.roster[id].purchased=!!val;
        saveState();
        if(typeof syncParsedOwnedButtons==='function')syncParsedOwnedButtons(parsedRoot,id,val);
        return;
      }
      if(own.closest('.wiki-folder-children')){
        const id=own.dataset.owned;
        state.roster[id]=state.roster[id]||{};
        state.roster[id].purchased=!!val;
        saveState();
        own.dataset.ownedVal=val?'0':'1';
        own.textContent=val?t('remove'):t('buy');
        own.className=val?'unset':'buy';
        const card=own.closest('.tree-card,.wiki-tech-card');
        if(card)card.classList.toggle('owned',val);
        if(typeof updateOpenFolderOwnedState==='function')updateOpenFolderOwnedState(own.closest('.wiki-folder'));
        return;
      }
      setOwned(own.dataset.owned,val);
      return;
    }
    const add=el.matches?.('[data-add]')?el:null;
    if(add){openAddToLineup(add.dataset.add);return;}
    const tal=el.matches?.('[data-talisman]')?el:null;
    if(tal){setTalisman(tal.dataset.talisman,tal.dataset.talismanVal==='1');return;}
  }
  function handleRosterActionV384(e){
    if(e.type==='pointerdown'&&e.button!==0)return;
    if(e.type==='mousedown'&&e.button!==0)return;
    const el=findRosterActionV384(e);
    if(!el)return;
    const key=actionKeyV384(el);
    if(!key)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const now=Date.now();
    if(e.type==='click'&&lastAction&&lastAction.key===key&&(now-lastAction.at)<RECENT_MS)return;
    lastAction={key,at:now};
    runRosterActionV384(el);
  }
  document.addEventListener('pointerdown',handleRosterActionV384,true);
  if(!window.PointerEvent)document.addEventListener('mousedown',handleRosterActionV384,true);
  document.addEventListener('click',handleRosterActionV384,true);
})();

</script>

function normalizeDisplayName(raw,v){

  for(const [a,b] of repl)s=s.replace(a,b);

function englishLabelFromText(raw, fallbackId='') {

  const original=String(raw||'').trim();

function buildWikiIconIndex(layouts){
  const idx={};
  const addNode=n=>{
    if(!n)return;
    if(n.type==='unit'&&n.id&&n.icon)idx[n.id]=n.icon;
    if(n.type==='group'){
      const icons=n.memberIcons||n.icons||{};
      for(const [id,icon] of Object.entries(icons||{})){if(id&&icon)idx[id]=icon}
    }
  };
  for(const layout of Object.values(layouts||{})){
    for(const rank of Object.values(layout?.ranks||{})){
      for(const col of (rank.leftCols||rank.left||[]))for(const n of (col||[]))addNode(n);
      for(const n of (rank.right||rank.rightNodes||[]))addNode(n);
    }
  }
  return idx;
}

function prefixGlyphFromLabelV342(label){
  const s=String(label||'').trim();
  const m=s.match(/^([\uE000-\uF8FF▁▂▃▄▅▆▇█▀■□○◯◌◔◘◍◗◡◢◥◄◊⋠␗␙␠★☆✪✦])/u);
  return m?m[1]:'';
}
function buildWikiPrefixIndexV342(layouts){
  const idx={};
  const add=(id,label)=>{const g=prefixGlyphFromLabelV342(label); if(id&&g)idx[String(id)]=g;};
  const addNode=n=>{
    if(!n)return;
    if(n.type==='unit') add(n.id, n.label||n.name||'');
    if(n.type==='group'){
      const g=prefixGlyphFromLabelV342(n.label||n.name||'');
      for(const id of (n.ids||[])){ if(id&&g)idx[String(id)]=g; }
      const memberLabels=n.memberLabels||n.labels||{};
      for(const [id,label] of Object.entries(memberLabels||{})) add(id,label);
    }
  };
  for(const layout of Object.values(layouts||{})){
    for(const rank of Object.values(layout?.ranks||{})){
      for(const col of (rank.leftCols||rank.left||[]))for(const n of (col||[]))addNode(n);
      for(const n of (rank.right||rank.rightNodes||[]))addNode(n);
    }
  }
  return idx;
}

function drawParsedWikiConnectors(){
  const root=rosterTreeWrap?.querySelector('.parsed-layout');
  if(!root)return;
  root.querySelectorAll('.wiki-link-svg').forEach(x=>x.remove());
  const nodes=[...root.querySelectorAll('.wiki-node[data-id]')];
  const byId=new Map();
  nodes.forEach(n=>{const id=n.dataset.id;if(id&&!byId.has(id))byId.set(id,n)});
  const rr=root.getBoundingClientRect();
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','wiki-link-svg');
  svg.setAttribute('viewBox',`0 0 ${Math.max(1,rr.width)} ${Math.max(1,rr.height)}`);
  svg.setAttribute('preserveAspectRatio','none');
  const addPath=(d,x,y,dir='down')=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);p.setAttribute('class','wiki-link-line');svg.appendChild(p);
    const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    let pts;
    if(dir==='right') pts=`${x},${y} ${x-8},${y-5} ${x-8},${y+5}`;
    else if(dir==='left') pts=`${x},${y} ${x+8},${y-5} ${x+8},${y+5}`;
    else pts=`${x},${y} ${x-5},${y-8} ${x+5},${y-8}`;
    poly.setAttribute('points',pts);poly.setAttribute('class','wiki-link-arrow');svg.appendChild(poly);
  };
  const box=(el)=>{const b=el.getBoundingClientRect();return {l:b.left-rr.left,t:b.top-rr.top,r:b.right-rr.left,b:b.bottom-rr.top,w:b.width,h:b.height,cx:b.left+b.width/2-rr.left,cy:b.top+b.height/2-rr.top}};
  nodes.forEach(to=>{
    const req=to.dataset.req||''; if(!req)return;
    const from=byId.get(req); if(!from || from===to)return;
    const a=box(from), b=box(to);
    if(!Number.isFinite(a.cx+b.cx+a.b+b.t))return;
    if(Math.abs(a.cy-b.cy)<30 && Math.abs(a.cx-b.cx)>30){
      if(a.cx<b.cx) addPath(`M ${a.r} ${a.cy} L ${b.l-6} ${b.cy}`, b.l-6, b.cy, 'right');
      else addPath(`M ${a.l} ${a.cy} L ${b.r+6} ${b.cy}`, b.r+6, b.cy, 'left');
      return;
    }
    if(Math.abs(a.cx-b.cx)<26){
      addPath(`M ${a.cx} ${a.b} L ${b.cx} ${b.t-4}`, b.cx, b.t-4, 'down');
      return;
    }
    if(b.t>a.b){
      const midY=Math.max(a.b+16, b.t-18);
      addPath(`M ${a.cx} ${a.b} L ${a.cx} ${midY} L ${b.cx} ${midY} L ${b.cx} ${b.t-4}`, b.cx, b.t-4, 'down');
      return;
    }
    // unusual upward/cross-rank relation: use a clean elbow without misleading arrow direction.
    const midY=(a.cy+b.cy)/2;
    addPath(`M ${a.cx} ${a.cy} L ${a.cx} ${midY} L ${b.cx} ${midY} L ${b.cx} ${b.t-4}`, b.cx, b.t-4, 'down');
  });
  root.prepend(svg);
}

function linkedParentId(v, visibleSet, assigned, idxMap){
  const id=idOf(v), idx=idxMap.get(id)??999999;
  const links=researchLinks?.[id]||[];

  for(const n of links){
    if(!visibleSet.has(n)||!assigned.has(n))continue;

function parsedLayoutNodeHtml(node,idMap,mode,used,treeKey){

    if(!ids.length)return '';

    const n={folder:node.label||node.name||nameOf(lead),ids:ids,icon:node.icon||node.iconSlug||''};
    const children=present.map(v=>treeCard(v,mode)).join('');

    return `<div class="wiki-node wiki-folder ${allOwned?'folder-owned':''}" data-id="${esc(node.id||ids[0]||'')}" data-req="${esc(node.req||'')}"><div class="wiki-mini-card folder-icon" title="${label}">${groupThumb(n,lead,treeKey)}<div class="wiki-mini-text"><div class="wiki-mini-name">${label}</div><div class="wiki-mini-br">${esc(folderRangeText(present,mode))}</div></div><div class="wiki-folder-spacer" aria-hidden="true"></div></div><div class="wiki-folder-children">${children}</div></div>`;

function parsedNodeRow(node){const r=Number(node?.row);return Number.isFinite(r)&&r>=0?Math.floor(r):0}
function parsedPositionedLeftHtml(leftCols,idMap,mode,used,key,nodeExists){
  let items=[];let maxRow=0;
  for(let c=0;c<5;c++){
    const col=leftCols[c]||[];
    for(const node of col){
      if(!nodeExists(node))continue;
      const row=parsedNodeRow(node);
      maxRow=Math.max(maxRow,row);
      const inner=parsedLayoutNodeHtml(node,idMap,mode,used,key);
      if(!inner)continue;
      items.push(`<div class="wiki-pos-node" style="grid-column:${c+1};grid-row:${row+1}">${inner}</div>`);
    }
  }
  return `<div class="wiki-columns wiki-positioned" style="--wiki-rows:${maxRow+1}">${items.join('')}</div>`;
}

function parsedPositionedRightHtml(nodes,idMap,mode,used,key,nodeExists){
  let items=[];let maxRow=0;
  for(const node of (nodes||[])){
    if(!nodeExists(node))continue;
    const row=parsedNodeRow(node);
    const colRaw=Number(node?.col);
    const col=Number.isFinite(colRaw)&&colRaw>=0?Math.min(1,Math.floor(colRaw)):0;
    maxRow=Math.max(maxRow,row);
    const inner=parsedLayoutNodeHtml(node,idMap,mode,used,key);
    if(!inner)continue;
    items.push(`<div class="wiki-pos-node" style="grid-column:${col+1};grid-row:${row+1}">${inner}</div>`);
  }
  return `<div class="wiki-positioned wiki-positioned-right" style="--wiki-rows:${maxRow+1}">${items.join('')}</div>`;
}

  if(Number.isFinite(e.clientX)&&Number.isFinite(e.clientY)){

slotVehicle = function(s,p=null){
  if(s.vehicleId&&byId.has(s.vehicleId))return byId.get(s.vehicleId);
  const q=norm(s.query);if(!q)return null;let best=null,score=-1;

    const n=norm(nameOf(v)),id=norm(idOf(v));let sc=-1;if(n===q||id===q)sc=1000;else if(n.startsWith(q)||id.startsWith(q))sc=700;else if(v._search.includes(q))sc=300;
    if(sc>score){score=sc;best=v}
  }
  return best;
};

    document.querySelectorAll('.slot').forEach(el=>{el.ondragover=e=>{e.preventDefault();el.classList.add('drop-target')};el.ondragleave=e=>{if(!e.relatedTarget||!el.contains(e.relatedTarget))el.classList.remove('drop-target')};el.ondrop=e=>{e.preventDefault();el.classList.remove('drop-target');const a=Number(e.dataTransfer.getData('text/plain')),b=Number(el.dataset.slot);if(!Number.isInteger(a)||a===b)return;const p=saveLineupFromForm();const A=p.slots[a]||{},B=p.slots[b]||{};const moveKeys=['query','vehicleId','class'];for(const k of moveKeys){const tmp=A[k];A[k]=B[k];B[k]=tmp}p.slots[a]=A;p.slots[b]=B;saveState();renderLineupEditor()}});
  };

  function sameCrewForPoolV3863(idx,v,p,i){return crewTrainingRecordsSafeV3863(idx,v,p,i).same?.length?1:0}
  function vehiclePickScoreV3863(idx,v,p,i,slot,preferPrimary=true){
    const cp=classPriorityForLineupV3863Local(v,p);
    const same=sameCrewForPoolV3863(idx,v,p,i);
    const other=crewTrainingRecordsSafeV3863(idx,v,p,i).sameNation?.length?1:0;
    const role=typeof autopickRoleScore==='function'?autopickRoleScore(v,slot):0;
    const primaryScore=preferPrimary?(cp===2?100000:0):0;
    return same*10000000 + other*200000 + primaryScore + role*100 + (isOwned(v)?10:0) - Math.abs(brVal(v,modeKey(p.mode))-Number(p.brMax));
  }
  function takeBestFromRemainingV3863(remaining,used,lineupUsed,p,i,filterFn){
    const slot=roleAwareSlotForAutopickV361(p,i);slot._crewIndex=i;slot._lineup=p;
    const idx=buildCrewTrainingIndexV386();
    let bestIdx=-1,best=-Infinity;
    for(let j=0;j<remaining.length;j++){
      const v=remaining[j], id=idOf(v);
      if(!id||used.has(id)||lineupUsed.has(id))continue;
      if(filterFn&&!filterFn(v))continue;
      const sc=vehiclePickScoreV3863(idx,v,p,i,slot,true);
      if(sc>best){best=sc;bestIdx=j;}
    }
    delete slot._crewIndex;delete slot._lineup;
    if(bestIdx<0)return null;
    const [v]=remaining.splice(bestIdx,1);used.add(idOf(v));lineupUsed.add(idOf(v));return v;
  }
  function hasSameCandidateV3863(idx,arr,p,i){return arr.some(v=>sameCrewForPoolV3863(idx,v,p,i));}
  function bestSameCandidateScoreV3863(idx,arr,p,i){let best=0;for(const v of arr){if(sameCrewForPoolV3863(idx,v,p,i))best=Math.max(best,1000+(typeof autopickRoleScore==='function'?autopickRoleScore(v,{_crewIndex:i,_lineup:p}):0));}return best;}
  function slotOrderForPrimaryV3863(open,idx,primary,secondary,p){
    return [...open].sort((a,b)=>{
      const aSameP=hasSameCandidateV3863(idx,primary,p,a), bSameP=hasSameCandidateV3863(idx,primary,p,b);
      if(aSameP!==bSameP)return bSameP-aSameP; // crews already trained for primary vehicles first
      const aSameS=hasSameCandidateV3863(idx,secondary,p,a), bSameS=hasSameCandidateV3863(idx,secondary,p,b);
      if(aSameS!==bSameS)return aSameS-bSameS; // preserve crews trained for aircraft/secondary vehicles when possible
      return b-a < 0 ? -1 : a-b;
    });
  }
  function slotOrderForSecondaryV3863(open,idx,secondary,p){
    return [...open].sort((a,b)=>bestSameCandidateScoreV3863(idx,secondary,p,b)-bestSameCandidateScoreV3863(idx,secondary,p,a)||a-b);
  }

  fillLineup=function(p,pool,count,used=new Set(),keep=false){
    ensureSlots(p);
    const max=crewSlotsMaxV354();
    const targetCount=Math.max(1,Math.min(max,Number(count)||max));
    const protect=readProtectModeV3863();
    const protectedIdx=[];const lineupUsed=new Set();
    for(const i of crewSlotIndicesV354()){
      const slot=p.slots[i]||{};
      const current=slotVehicle(slot,null);
      const currentId=current?idOf(current):'';
      const filled=!!(String(slot.vehicleId||'').trim()||String(slot.query||'').trim());
      const shouldProtect=protect==='all'?filled:(protect==='owned'?(current&&isOwned(current)):false);
      if(shouldProtect){
        protectedIdx.push(i);
        if(currentId&&!used.has(currentId)&&!lineupUsed.has(currentId)){
          used.add(currentId);lineupUsed.add(currentId);
          const idx=pool.findIndex(v=>idOf(v)===currentId);if(idx>=0)pool.splice(idx,1);
        }
      }
    }
    const protectedSet=new Set(protectedIdx);
    const targetSlots=crewSlotIndicesV354().filter(i=>protectedSet.has(i)||i<targetCount);
    const open=targetSlots.filter(i=>!protectedSet.has(i));
    const targetSet=new Set(targetSlots);
    for(const i of crewSlotIndicesV354()){
      if(protectedSet.has(i))continue;
      if(!targetSet.has(i)){const slot=p.slots[i]||{};p.slots[i]={...slot,vehicleId:'',query:'',class:'auto'};}
    }
    const idx=buildCrewTrainingIndexV386();
    const remaining=[...pool];
    pool.length=0;
    const primary=remaining.filter(v=>classPriorityForLineupV3863Local(v,p)===2);
    const secondary=remaining.filter(v=>classPriorityForLineupV3863Local(v,p)!==2);
    const assigned=new Set();
    function assign(i,v){if(!v)return false;const slot=roleAwareSlotForAutopickV361(p,i);p.slots[i]={...slot,vehicleId:idOf(v),query:nameOf(v),class:'auto'};assigned.add(i);return true;}
    const primarySlots=slotOrderForPrimaryV3863(open,idx,primary,secondary,p).slice(0,Math.min(primary.length,open.length));
    for(const i of primarySlots){
      const v=takeBestFromRemainingV3863(remaining,used,lineupUsed,p,i,x=>classPriorityForLineupV3863Local(x,p)===2);
      if(v)assign(i,v);
    }
    const secondarySlots=slotOrderForSecondaryV3863(open.filter(i=>!assigned.has(i)),idx,secondary,p);
    for(const i of secondarySlots){
      let v=takeBestFromRemainingV3863(remaining,used,lineupUsed,p,i,x=>classPriorityForLineupV3863Local(x,p)!==2);
      if(!v)v=takeBestFromRemainingV3863(remaining,used,lineupUsed,p,i,null);
      if(v)assign(i,v);
      else {const slot=p.slots[i]||{};p.slots[i]={...slot,vehicleId:'',query:'',class:'auto'};}
    }
    // If primary vehicles exceeded open slots or phase ordering left holes, fill any still-open target slots.
    for(const i of open){
      if(assigned.has(i))continue;
      const v=takeBestFromRemainingV3863(remaining,used,lineupUsed,p,i,null);
      if(v)assign(i,v);else {const slot=p.slots[i]||{};p.slots[i]={...slot,vehicleId:'',query:'',class:'auto'};}
    }
    // put unused vehicles back for create-all mode
    remaining.forEach(v=>pool.push(v));
    return p;
  };

  openAutopick=function(){
    const p=saveLineupFromForm();
    const policy=autopickClassPolicy(p.mode);
    const def=selectedClassesV359(p);
    const count=selectedAutopickCountV359(p);
    const protect=selectedProtectModeV3863(p);
    const checked=v=>protect===v?'checked':'';
    const classChecks=CLASS_KEYS.map(c=>{
      const allowed=policy.allowed.includes(c);
      const available=allowed&&classAvailableForAutopick(p,c);
      const primary=policy.primary.includes(c);
      const disabled=!allowed||!available;
      return `<label class="big-check class-check ${primary?'primary':''} ${disabled?'disabled':''}"><input type="checkbox" name="mgClass" value="${esc(c)}" ${def.includes(c)&&available?'checked':''} ${disabled?'disabled':''}>${esc(classLabel(c))}</label>`;
    }).join('');
    openModal(`
      <div class="modal-grid"><div class="field"><label>${t('autopickCount')}</label><select id="mgCount">${crewSlotIndicesV354().map(i=>opt(i+1,i+1,i+1===count?count:null)).join('')}</select></div><div class="notice">${t('crewSlotCountNote')}</div></div>
      <h3>${t('protectFilledSlots')}</h3><div class="autopick-protect-row"><label class="big-check compact-check"><input type="radio" name="mgProtectMode" value="none" ${checked('none')}> ${t('ignoreFilledSlots')}</label><label class="big-check compact-check"><input type="radio" name="mgProtectMode" value="owned" ${checked('owned')}> ${t('keepBought')}</label><label class="big-check compact-check"><input type="radio" name="mgProtectMode" value="all" ${checked('all')}> ${t('keepAllFilled')}</label></div>
      <div class="notice">${t('autopickCrewTrainingNote')}</div>
      <h3>${t('vehicleClasses')}</h3><div class="autopick-class-row">${classChecks}</div>
      <h3>${t('acquisitionUsePolicy')}</h3>${autopickPolicyTableV356()}
      ${autopickOwnershipBoxV358(p)}
      <div id="mgStatus"></div>
      <div class="footer-actions"><button type="button" id="mgRun" data-modal-action="autopick-run" onpointerdown="return window.WTModalAction&&window.WTModalAction('autopick-run',event)" onclick="return window.WTModalAction&&window.WTModalAction('autopick-run',event)">${t('autopick')}</button><button class="ghost" onclick="closeModal()">${t('cancel')}</button></div>`);
    document.getElementById('modalBox')?.classList.add('autopick-compact');
    setTimeout(()=>{document.querySelectorAll('#modal input,#modal select').forEach(el=>el.addEventListener('change',()=>saveAutopickSettingsV359(p)));},0);
  };
})();
</script>
